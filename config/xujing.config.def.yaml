
# 决斗系列插件 设置
duel_cfg: 
  # 战斗力依赖系数(每个小境界/装备加成影响胜率%,默认8,胜率限制5%~100%)
  Magnification: 8
  # 命令间隔时间，单位秒，这是决斗的冷却时间#初始为300秒
  Cooling_time: 300
  # 命令间隔时间，单位分钟，这是修炼的冷却时间#默认60分钟
  cdtime_exercise: 60
  # 命令间隔时间，单位分钟，这是突破的冷却时间#默认30分钟
  cdtime_break: 30
# 娶群友系列配置
wife_cfg:
  #概率,单位(成)
  #强娶老婆成功率
  qqwife: 3
  #随机娶群友成功概率
  sjwife: 5
  #冷却时间,单位(分)
  #随机娶冷却
  sjcd: 60
  #强娶冷却
  qqcd: 60
  #抱抱冷却
  bbcd: 60
  #双修冷却
  fkcd: 120
  #逛街冷却
  ggcd: 120
  #抢老婆冷却
  qlpcd: 60
  #领取低保冷却
  poorcd: 1440
  #获取虚境彩球的cd
  RBBgetcd: 720
  #行动限制,单位(次)
  #逛街->去下一个地方
  gifttime: 1
  #虚境彩球
  #开奖通知主人 F关 T开
  notice: 'F'
  #开奖通知群
  group:
    - 123456789
    - 123123123
  #开奖时间,单位(24制-时0到23)
  RBBtime: 20
  #虚境秘境
  #秘境开放准时播报 F关 T开
  secret_notice: 'T'
  #秘境播报白名单群(只向这些群播报)
  secret_group:
    - 136303457
  #秘境播报时间,单位(24制-时0到23),默认20点
  secret_time: 20
  #自动挂机
  #挂机收益提示 F关 T开
  afk_notice: 'T'
  #挂机提示白名单群(只在这些群提示)
  afk_group:
    - "136303457"
  #挂机满多少小时没说话才提示,默认24(1天)
  afk_hour: 24
  #挂机每天最多获得灵石,默认2400
  afk_money: 2400
  #挂机每天最多获得灵力,默认300
  afk_lp: 300
# 幻境试炼
trial_cfg:
  # 每日排行榜播报 F关 T开(每天0点向白名单群渲染发送排行榜图片)
  trial_notice: 'T'
  # 排行榜播报白名单群(只向这些群发送排行榜图片)
  trial_group:
    - 136303457
  # 试炼每天挑战次数(0点重置),默认2次
  trial_cd: 2
  # 试炼攻击回合数,默认10(3~30)
  trial_rounds: 10
# 全局指令频率限制(防刷屏)
limit_cfg:
  # 指令间隔时间,单位(秒),默认6秒内只接受一条指令
  time: 6
  # 超限时是否提示 F静默 T提示
  notice: 'F'
# 长消息渲染图片(统一模板+帮助背景图;短消息/一句话直接发文字)
reply_cfg:
  # 文本长度超过该值(字符数)才渲染为图片
  min_length: 50
  # 单张图片最大字符数,超过自动分页并用转发消息发送
  max_length: 600
# 遗蜕秘境
realm_cfg:
  # 总开关 F关 T开
  enable: 'F'
  # 白名单群(只在这些群刷新/播报)
  group:
    - 136303457
  # 1天周期最多场次
  spawn_per_cycle: 3
  # 周期时长(小时)
  cycle_hours: 24
  # 周期首刷区间(小时)
  first_spawn_hours:
    - 3
    - 18
  # 刷新后下次区间(小时)
  next_spawn_hours:
    - 2
    - 12
  # 探索时长随机区间(分钟)
  explore_min:
    - 15
    - 60
  # 每次行动CD(分钟)
  action_cd_min: 1
  # 每队每场行动上限
  max_steps: 20
  # 每人每场最多被搜刮背包件数
  loot_cap: 5
  # 每场意外上限
  event_max: 4
  # 夜间(1~6点)不刷 F否 T是
  night_stop: 'T'
  # 额外奖励池(所有地形都能出): 以后往这里加物品名即可, 不用改代码
  extra_rewards: []
# 闲置灵石清理(自动挂机检测扩展): 超期未使用虚境指令的玩家清空灵石余额
idle_cfg:
  # 总开关 F关 T开
  enable: 'T'
  # 超过多少天未使用虚境指令就清空灵石, 默认5天
  days: 5
  # 白名单群(只在这些群生效, 留空=所有群)
  group: []
