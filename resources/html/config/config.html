<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>虚境配置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      color: #e8e6e3;
      padding: 24px 20px;
      min-height: 100vh;
    }
    .card {
      max-width: 560px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .card h1 {
      padding: 16px 20px;
      font-size: 22px;
      letter-spacing: 4px;
      color: #ffd76e;
      background: rgba(255, 215, 110, 0.12);
      border-left: 4px solid #ffd76e;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
    }
    .row:last-child { border-bottom: none; }
    .key { font-size: 15px; font-weight: bold; color: #ffffff; }
    .val { font-size: 15px; color: #9ff0b0; }
    .tip {
      max-width: 560px;
      margin: 14px auto 0;
      font-size: 12px;
      color: #6e8b9a;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>虚境插件 · 冷却配置</h1>
    {{each Object.keys(config || {})}}
    <div class="row">
      <span class="key">{{$value}}</span>
      <span class="val">{{config[$value].size || config[$value]}} 秒</span>
    </div>
    {{/each}}
  </div>
  <div class="tip">使用 #虚境配置更改 键名*数值 修改冷却时间</div>
</body>
</html>
